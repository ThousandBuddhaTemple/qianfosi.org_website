<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0" ,
        maximum-scale="1.0, user-scalable=no" />
    <title>Thousand Buddha Temple</title>
    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="shared.css">
    <script defer src="../shared.js"></script>
    <script defer src="contact.js"></script> 
    <script src="https://kit.fontawesome.com/95a02bd20d.js"></script>
    <!-- Import font poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <!-- Import Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- EmailJS -->
    <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
    </script>
</head>

<body>
    <header></header>
    <main>
        <section class="contact-section">
            <h1>Contact Us</h1>
            <div class="contact-container">
                <div class="contact-info">
                    <h3>Contact Information</h3>
                    <p><i class="fas fa-phone"></i> Phone: +1 (617) 773-7745</p>
                    <p><i class="fas fa-envelope"></i> Email: 1000buddha@gmail.com</p>
                    <p><i class="fas fa-map-marker-alt"></i> Location: 53 Massachusetts Ave, Quincy, MA 02169</p>
                </div>
                <div class="contact-form-container">
                    <h3>Leave Us a Message</h3>
                    <form id="contact-form">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="from_name" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone</label>
                            <input type="tel" id="phone" name="phone">
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="from_email" required>
                        </div>
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="submit-btn">Submit</button>
                    </form>
                    <p id="form-status"></p>
                </div>
            </div>
            <div class="map-container">
                <h3>Our Location</h3>
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2951.758376170669!2d-71.0097720234731!3d42.25708897119427!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89e36398b1111111%3A0x89e36398b1111111!2s53%20Massachusetts%20Ave%2C%20Quincy%2C%20MA%2002169%2C%20USA!5e0!3m2!1sen!2sus!4v1701800000000!5m2!1sen!2sus"
                    width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </section>
    </main>
    <footer class="footer"></footer>

  <!-- 字体图标库 -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>

</html>
