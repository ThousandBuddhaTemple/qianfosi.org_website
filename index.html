        <h1>千佛寺</h1>

    <div class="announcement">

      <p>為恭迎觀音菩薩成道日，千佛寺將於2026年7月31日至8月2日舉辦法會，每天上午九點半禮拜大悲寶懺。祈求觀音菩薩加持，世界和平，國泰民安，災難不起。歡迎參加，同沾法益！法會期間可以做供齋等功德，請及早登記！</p>

        <div class="visit_index_card visit_index_card4">
